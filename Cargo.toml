[package]
name = "rs-japath2tokens"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[dependencies.serde]
version = "1"
default-features = false
features = [
    "std",
]

[dependencies.serde_json]
version = "1"
default-features = false
features = [
    "std",
]

[dependencies.lindera]
version = "3"
default-features = false
features = [
    "embed-ipadic",
]
